$kind: http-request
name: 'Create Note - Invalid JSON'
method: POST
url: '{{baseUrl}}/api/notes/'
description: Send malformed JSON - should return 400
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    not valid json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("Response has error field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('error');
      });
