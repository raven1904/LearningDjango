$kind: http-request
name: Register - Valid User
method: POST
url: '{{baseUrl}}/api/auth/register/'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser_{{$timestamp}}",
      "email": "testuser_{{$timestamp}}@example.com",
      "password": "TestPass123!",
      "first_name": "Test",
      "last_name": "User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has username field", function () {
          var json = pm.response.json();
          pm.expect(json.username).to.be.a("string");
      });

      pm.test("Save username and password to collection variables", function () {
          var json = pm.response.json();
          if (json.username) {
              pm.collectionVariables.set("registeredUsername", json.username);
          }
          pm.collectionVariables.set("registeredPassword", "TestPass123!");
      });
