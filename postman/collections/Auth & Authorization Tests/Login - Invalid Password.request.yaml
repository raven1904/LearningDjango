$kind: http-request
name: Login - Invalid Password
method: POST
url: '{{baseUrl}}/api/auth/login/'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser_duplicate",
      "password": "WrongPassword!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response contains detail field with error message", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("detail");
          pm.expect(json.detail).to.be.a("string").and.not.empty;
      });
