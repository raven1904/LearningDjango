$kind: http-request
name: Register - Duplicate User
method: POST
url: '{{baseUrl}}/api/auth/register/'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser_duplicate",
      "email": "dup@example.com",
      "password": "TestPass123!",
      "first_name": "Dup",
      "last_name": "User"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400 (duplicate username)", function () {
          pm.response.to.have.status(400);
      });
