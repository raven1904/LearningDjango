$kind: collection
name: Auth & Authorization Tests
description: Tests for authentication and authorization of the TaskFlow API
variables:
  - key: baseUrl
    value: 'http://127.0.0.1:8000'
    type: default
    enabled: true
  - key: accessToken
    value: ''
    type: default
    enabled: true
  - key: refreshToken
    value: ''
    type: default
    enabled: true
  - key: registeredUsername
    value: ''
    type: default
    enabled: true
  - key: registeredPassword
    value: ''
    type: default
    enabled: true
