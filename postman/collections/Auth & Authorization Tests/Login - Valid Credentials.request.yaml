$kind: http-request
name: Login - Valid Credentials
method: POST
url: '{{baseUrl}}/api/auth/login/'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "testuser_duplicate",
      "password": "TestPass123!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has access token", function () {
          var json = pm.response.json();
          pm.expect(json.access).to.be.a("string");
      });

      pm.test("Response has refresh token", function () {
          var json = pm.response.json();
          pm.expect(json.refresh).to.be.a("string");
      });

      pm.test("Save tokens to collection variables", function () {
          var json = pm.response.json();
          if (json.access) {
              pm.collectionVariables.set("accessToken", json.access);
          }
          if (json.refresh) {
              pm.collectionVariables.set("refreshToken", json.refresh);
          }
      });
