$kind: http-request
name: Token Refresh - Invalid Token
method: POST
url: '{{baseUrl}}/api/auth/refresh/'
order: 10000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh": "this.is.not.a.valid.token"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response contains detail or code field", function () {
          var json = pm.response.json();
          pm.expect(json.detail || json.code).to.exist;
      });
