$kind: http-request
name: Access Protected Route - No Token
method: GET
url: '{{baseUrl}}/api/auth/login/'
order: 12000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 405 (Method Not Allowed)", function () {
          pm.response.to.have.status(405);
      });
