$kind: http-request
name: 'Access Protected Route - With Expired/Invalid Token'
method: GET
url: '{{baseUrl}}/api/schema/'
order: 14000
auth:
  type: bearer
  credentials:
    - key: token
      value: 'invalidtoken.abc.xyz'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response contains detail field", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property("detail");
      });
